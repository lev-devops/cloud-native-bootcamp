services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports: ["3000:3000"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
