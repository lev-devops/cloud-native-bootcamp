---
- name: Create the local control environment
  hosts: control
  gather_facts: true
  vars:
    control_root: "{{ lookup('env', 'CONTROL_ROOT') | default(ansible_env.HOME ~ '/platform-control', true) }}"
    control_overwrite: false
    required_commands:
      - git
      - python3
      - ssh
      - ansible-playbook
  tasks:
    - name: Inspect the requested control target
      ansible.builtin.stat:
        path: "{{ control_root }}"
        follow: false
      register: control_target

    - name: Refuse a symlink control target
      ansible.builtin.assert:
        that: not control_target.stat.islnk | default(false)
        fail_msg: "Control target must not be a symlink: {{ control_root }}"

    - name: Inspect existing control target contents
      ansible.builtin.find:
        paths: "{{ control_root }}"
        recurse: true
        hidden: true
        file_type: any
      register: control_contents
      when: control_target.stat.exists and control_target.stat.isdir

    - name: Require a new or empty control target unless explicitly overridden
      ansible.builtin.assert:
        that:
          - not control_target.stat.exists or not control_target.stat.isdir or (control_contents.matched | default(0) | int) == 0 or (control_overwrite | bool)
        fail_msg: "Control target exists and is non-empty: {{ control_root }}. Use -e control_overwrite=true only after review."

    - name: Require a supported control operating system
      ansible.builtin.assert:
        that: ansible_system in ['Darwin', 'Linux']
        fail_msg: "Unsupported control OS: {{ ansible_system }}"

    - name: Check required control commands
      ansible.builtin.command: "command -v {{ item }}"
      check_mode: false
      loop: "{{ required_commands }}"
      changed_when: false

    - name: Create control project directories
      ansible.builtin.file:
        path: "{{ control_root }}/{{ item }}"
        state: directory
        mode: '0750'
      loop:
        - environments
        - generated
        - logs

    - name: Write control environment identity
      ansible.builtin.copy:
        dest: "{{ control_root }}/CONTROL_ENVIRONMENT"
        content: "created_by=cloud-native-bootcamp\nseed_commit={{ lookup('pipe', 'git rev-parse HEAD 2>/dev/null || echo unknown') }}\n"
        mode: '0640'
